<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Night — just for Juliana</title>
<meta name="description" content="One little question. A very lovely possibility.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b3264c'/%3E%3Ctext x='16' y='25' font-size='27' text-anchor='middle' fill='white'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--ink:#67223a;--pink:#b3264c}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f9dce4;color:var(--ink);font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:36px 20px 24px}header{font-size:14px;letter-spacing:.25em;text-transform:uppercase;font-weight:700}header span{color:var(--pink);padding:0 10px}main{flex:1;display:grid;place-items:center;width:100%;padding:48px 0}.note{position:relative;width:min(640px,100%);text-align:center;background:#fff8fa;border:1px solid #edb9c8;padding:52px 28px 44px;box-shadow:10px 12px 0 #edb9c857;border-radius:6px}.eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 28px}.heart{font-family:Georgia,serif;font-size:65px;line-height:1;color:var(--pink);display:block;margin-bottom:24px}h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(42px,7vw,68px);font-weight:400;line-height:1.08;letter-spacing:-.045em;margin:0 auto 24px;max-width:510px}h1 em{color:var(--pink);font-weight:400}p{font-size:17px;line-height:1.65;margin:0}.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;min-height:56px;margin:32px 0 22px}button{font:700 16px Arial,sans-serif;border-radius:100px;min-width:112px;min-height:54px;padding:15px 25px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #67223a;outline-offset:5px}#yes{background:var(--pink);color:white;border:2px solid var(--pink);box-shadow:0 5px 0 #87233e}#yes:hover{background:#96203f}#no{background:#fff8fa;color:var(--ink);border:1px solid #d6a4b3;z-index:5}.hint{font-size:13px;color:#8b5969;min-height:22px}footer{font:italic 16px Georgia,serif;padding-top:20px}.success .heart{font-size:85px}.success h1{margin-bottom:24px}.success{animation:appear .45s ease-out}.confetti{position:fixed;pointer-events:none;color:var(--pink);top:-40px;animation:fall 2.8s ease-in forwards;z-index:10}@keyframes fall{to{transform:translateY(110vh) rotate(240deg);opacity:0}}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:480px){body{padding:26px 18px 20px}main{padding:35px 0}.note{padding:38px 20px}h1{font-size:44px}.eyebrow{font-size:12px}.heart{font-size:55px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<header>Juliana <span>♥</span> this is for you</header>
<main><section class="note" aria-labelledby="question">
<p class="eyebrow">One less lonely girl…</p>
<span class="heart" aria-hidden="true">♡</span>
<h1 id="question">Will you go on a <em>date with me?</em></h1>
<p>Something lovely starts with a little yes.</p>
<div class="buttons"><button id="yes" type="button" aria-label="Yes — Somebody to Love">Somebody to Love ♥</button><button id="no" type="button" aria-describedby="hint">No</button></div>
<p class="hint" id="hint" aria-live="polite">Psst… the “No” is a little shy.</p>
</section></main>
<footer>made with a little courage & a lot of butterflies</footer>
<script>
const no=document.querySelector('#no'),yes=document.querySelector('#yes'),note=document.querySelector('.note'),hint=document.querySelector('#hint');
let moved=false,count=0;
const recentSpots=[];
function escapeNo(event){
 if(event)event.preventDefault();
 if(!no.isConnected)return;
 if(!moved){
  const space=document.createElement('span');
  space.style.width=no.offsetWidth+'px';space.style.height=no.offsetHeight+'px';space.style.flexShrink='0';
  space.setAttribute('aria-hidden','true');no.before(space);no.style.position='absolute';moved=true;
 }
 const old=no.getBoundingClientRect(),safe=yes.getBoundingClientRect(),pad=16;
 const card=note.getBoundingClientRect(),originX=card.left+note.clientLeft,originY=card.top+note.clientTop;
 const maxX=Math.max(pad,note.clientWidth-old.width-pad),maxY=Math.max(pad,note.clientHeight-old.height-pad);
 let choices=[];
 for(let i=0;i<80;i++){
  const x=pad+Math.random()*(maxX-pad),y=pad+Math.random()*(maxY-pad);
  const screenX=originX+x,screenY=originY+y;
  const overlaps=screenX<safe.right+20&&screenX+old.width>safe.left-20&&screenY<safe.bottom+20&&screenY+old.height>safe.top-20;
  const nearPointer=event&&Number.isFinite(event.clientX)&&event.clientX>screenX-25&&event.clientX<screenX+old.width+25&&event.clientY>screenY-25&&event.clientY<screenY+old.height+25;
  if(!overlaps&&!nearPointer)choices.push({x,y,d:Math.hypot(screenX-old.x,screenY-old.y)});
 }
 const spacing=Math.min(95,Math.min(maxX-pad,maxY-pad)/3);
 const fresh=choices.filter(spot=>spot.d>=spacing&&recentSpots.every(previous=>Math.hypot(spot.x-previous.x,spot.y-previous.y)>=spacing));
 const distant=choices.filter(spot=>spot.d>=spacing);
 const pool=fresh.length?fresh:distant.length?distant:choices;
 const next=pool[Math.floor(Math.random()*pool.length)]||{x:Math.max(pad,Math.min(maxX,old.x-originX)),y:Math.max(pad,Math.min(maxY,old.y-originY))};
 recentSpots.push({x:next.x,y:next.y});if(recentSpots.length>5)recentSpots.shift();
 no.style.left=next.x+'px';no.style.top=next.y+'px';
 hint.textContent='What Do You Mean?';
}
no.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')escapeNo(e)});
no.addEventListener('click',escapeNo);
window.addEventListener('resize',()=>{if(moved)escapeNo()});
yes.addEventListener('click',()=>{
 note.classList.add('success');
 note.innerHTML='<p class="eyebrow">Juliana, my favorite answer</p><span class="heart" aria-hidden="true">♥</span><h1 id="question" tabindex="-1">It’s a <em>date!</em></h1><p>Just me, you, and a little Bieber on the playlist. 💜</p>';
 document.querySelector('#question').focus();
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<28;i++){const heart=document.createElement('span');heart.className='confetti';heart.textContent=i%2?'♥':'♡';heart.setAttribute('aria-hidden','true');heart.style.left=Math.random()*100+'vw';heart.style.fontSize=(14+Math.random()*22)+'px';heart.style.animationDelay=Math.random()*.8+'s';document.body.append(heart);setTimeout(()=>heart.remove(),4000)}}
});
</script>
</body></html>
